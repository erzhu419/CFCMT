   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #242a31" x="25.722" y="24.66" transform="rotate(-0 25.722 24.66)">From MC-WM to causal cross-network transfer</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.3px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #66717e" x="25.722" y="37.2312" transform="rotate(-0 25.722 37.2312)">The paper's theory is a constrained world-model transfer argument, not a claim of black-box policy transfer.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #244e80" x="29.4264" y="63.072" transform="rotate(-0 29.4264 63.072)">1  Mechanism-conditioned world model</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #2d7f50" x="29.4264" y="152.118" transform="rotate(-0 29.4264 152.118)">2  Causal/factored residual transfer</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #2e7c82" x="29.4264" y="241.164" transform="rotate(-0 29.4264 241.164)">3  Target instantiation and guarded control</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #244e80" x="43.7148" y="95.537981" transform="rotate(-0 43.7148 95.537981)">Simulator prior</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(43.7148 107.0454)">f0(s,a): uncalibrated</text>
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(43.7148 114.01748)">dynamics and feasible phases</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #244e80" x="210.4128" y="95.537981" transform="rotate(-0 210.4128 95.537981)">Mechanism state</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(210.4128 107.0454)">theta_m,t encodes context for</text>
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(210.4128 114.19548)">each transition mechanism</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #244e80" x="377.1108" y="95.537981" transform="rotate(-0 377.1108 95.537981)">World-model output</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(377.1108 107.0454)">headway/queue, demand, speed,</text>
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(377.1108 114.01748)">dwell, reward or cost</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #2d7f50" x="43.7148" y="181.091981" transform="rotate(-0 43.7148 181.091981)">Residual decomposition</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(43.7148 192.5994)">f_c(s,a)=f0(s,a)+r_c(s,a),</text>
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(43.7148 199.74948)">split by mechanism m</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #2d7f50" x="210.4128" y="181.091981" transform="rotate(-0 210.4128 181.091981)">Parent-set invariance</text>
   </g>
   <g id="text_15">
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(210.4128 192.5994)">r_c,m depends only on Pa_m, not</text>
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(210.4128 199.74948)">on every city/network feature</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #2d7f50" x="377.1108" y="181.091981" transform="rotate(-0 377.1108 181.091981)">Trust / selector</text>
   </g>
   <g id="text_17">
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(377.1108 192.5994)">source-fold validation and</text>
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(377.1108 199.57148)">target summaries gate residual</text>
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(377.1108 206.54356)">evidence</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #2e7c82" x="43.7148" y="270.137981" transform="rotate(-0 43.7148 270.137981)">Cross-city data</text>
   </g>
   <g id="text_19">
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(43.7148 281.6454)">bus cities supply passive</text>
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(43.7148 288.61748)">residual validation and</text>
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(43.7148 295.58956)">information budgets</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #2e7c82" x="210.4128" y="270.137981" transform="rotate(-0 210.4128 270.137981)">Cross-network TSC</text>
   </g>
   <g id="text_21">
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(210.4128 281.6454)">RESCO targets instantiate the</text>
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(210.4128 288.61748)">same mechanism-transfer idea</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #b2762c" x="377.1108" y="270.137981" transform="rotate(-0 377.1108 270.137981)">Guarded MPC</text>
   </g>
   <g id="text_23">
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(377.1108 281.6454)">learned phase only if it</text>
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #242a31" transform="translate(377.1108 288.61748)">improves on pressure prior</text>
   </g>
   <g id="text_24">
    <text style="font-size: 7.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #66717e" x="271.8" y="339.18075" transform="rotate(-0 271.8 339.18075)">Dense residual transfer removes these restrictions; CFCMT keeps mechanism parents, source trust and control safety separate.</text>
   </g>
  </g>
 </g>
